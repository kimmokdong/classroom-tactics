<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Tactics - Report Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
        }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 98%;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        button, .file-upload {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.9rem;
            text-align: center;
        }

        button:hover, .file-upload:hover {
            background: var(--accent-hover);
        }

        button:active, .file-upload:active {
            transform: translateY(1px);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--text-primary);
        }

        th[data-sort]::after {
            content: ' ↕';
            opacity: 0.3;
        }

        th.sort-asc::after { content: ' ↑'; opacity: 1; }
        th.sort-desc::after { content: ' ↓'; opacity: 1; }

        tbody tr {
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        td {
            font-size: 0.9rem;
        }
        
        .type-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .winrate-high { color: var(--success); font-weight: 600; }
        .winrate-med { color: #f59e0b; font-weight: 600; }
        .winrate-low { color: var(--danger); font-weight: 600; }

        .unit-detail {
            white-space: normal;
            min-width: 300px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-secondary);
        }
        
        .unit-detail strong {
            color: #fbbf24;
        }
        
        #statusMessage {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>📊 시뮬레이션 리포트 뷰어</h1>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="🔍 명칭, 유닛 검색...">
                <select id="levelFilter">
                    <option value="all">모든 레벨 (All)</option>
                    <option value="6L">6L (2코 리롤)</option>
                    <option value="7L">7L (3코 리롤)</option>
                    <option value="8L">8L (4코 운영)</option>
                    <option value="9L">9L (고밸류)</option>
                </select>
                <button onclick="loadDefaultReport()">새로고침 (최신)</button>
                <label class="file-upload">
                    파일 열기
                    <input type="file" id="fileInput" accept=".txt,.md">
                </label>
            </div>
        </header>
        <div class="table-container">
            <table id="reportTable">
                <thead>
                    <tr>
                        <th data-sort="rank">순위</th>
                        <th data-sort="type">덱 타입</th>
                        <th data-sort="name">덱 명칭</th>
                        <th data-sort="winrate">승률</th>
                        <th>🛡️ 메인 탱커</th>
                        <th>⚔️ 메인 딜러</th>
                        <th>🎯 서브 딜러</th>
                        <th data-sort="cost">코스트</th>
                        <th>구성 유닛 상세</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        <div id="statusMessage">데이터를 불러오는 중입니다...</div>
    </div>

    <script>
        let reportData = [];
        let currentSort = { column: 'rank', asc: true };

        // DOM Elements
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const levelFilter = document.getElementById('levelFilter');
        const fileInput = document.getElementById('fileInput');
        const statusMessage = document.getElementById('statusMessage');
        const headers = document.querySelectorAll('th[data-sort]');

        // Event Listeners
        searchInput.addEventListener('input', renderTable);
        levelFilter.addEventListener('change', renderTable);
        fileInput.addEventListener('change', handleFileUpload);
        headers.forEach(th => th.addEventListener('click', () => handleSort(th.dataset.sort)));

        async function loadDefaultReport() {
            statusMessage.textContent = '리포트 불러오는 중...';
            try {
                // Try report_1.txt first (new format), fallback to report_280G.txt
                let res = await fetch('report_1.txt');
                if (!res.ok) {
                    res = await fetch('report_280G.txt');
                }
                
                if (res.ok) {
                    const text = await res.text();
                    parseMarkdownTable(text);
                    statusMessage.textContent = `성공적으로 데이터를 불러왔습니다. (${reportData.length}개 덱)`;
                } else {
                    statusMessage.textContent = '기본 리포트 파일을 찾을 수 없습니다. (직접 파일을 열어주세요)';
                }
            } catch (err) {
                statusMessage.textContent = '파일을 불러오는데 실패했습니다. (로컬 서버 환경이 아닐 수 있습니다)';
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                parseMarkdownTable(event.target.result);
                statusMessage.textContent = `'${file.name}' 파일을 불러왔습니다. (${reportData.length}개 덱)`;
            };
            reader.readAsText(file);
        }

        function parseMarkdownTable(markdown) {
            const lines = markdown.split('\n');
            reportData = [];
            
            let inTable = false;
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('|') && line.includes('순위') && line.includes('덱 타입')) {
                    inTable = true;
                    continue;
                }
                if (inTable && line.includes('|:---')) continue;
                if (inTable && !line.startsWith('|')) {
                    inTable = false;
                    continue;
                }
                
                if (inTable) {
                    const cols = line.split('|').map(c => c.trim()).filter(c => c);
                    if (cols.length < 8) continue;
                    
                    let rankRaw = cols[0];
                    let rank = parseInt(rankRaw.replace(/[^0-9]/g, ''));
                    if (isNaN(rank)) {
                        if (rankRaw.includes('🥇')) rank = 1;
                        else if (rankRaw.includes('🥈')) rank = 2;
                        else if (rankRaw.includes('🥉')) rank = 3;
                        else rank = 999;
                    }
                    
                    let winrate = parseFloat(cols[3].replace(/[^0-9.]/g, '')) || 0;
                    let cost = parseInt(cols[7].replace(/[^0-9]/g, '')) || 0;
                    
                    reportData.push({
                        rankBadge: rankRaw,
                        rankNum: rank,
                        type: cols[1],
                        name: cols[2].replace(/\*\*/g, ''), // Remove bold markdown
                        winrateStr: cols[3].replace(/\*\*/g, ''),
                        winrate: winrate,
                        tank: cols[4],
                        dealer: cols[5],
                        sub: cols[6],
                        costStr: cols[7],
                        cost: cost,
                        detail: cols[8]
                    });
                }
            }
            
            currentSort = { column: 'rank', asc: true };
            updateSortUI();
            renderTable();
        }

        function handleSort(column) {
            if (currentSort.column === column) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.column = column;
                currentSort.asc = (column === 'rank'); // default asc for rank, desc for others
            }
            updateSortUI();
            renderTable();
        }

        function updateSortUI() {
            headers.forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === currentSort.column) {
                    th.classList.add(currentSort.asc ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        function renderTable() {
            const searchTerm = searchInput.value.toLowerCase();
            const levelTarget = levelFilter.value;
            
            // Filter
            let filtered = reportData.filter(row => {
                const matchSearch = row.name.toLowerCase().includes(searchTerm) || 
                                    row.detail.toLowerCase().includes(searchTerm) ||
                                    row.tank.toLowerCase().includes(searchTerm) ||
                                    row.dealer.toLowerCase().includes(searchTerm);
                const matchLevel = levelTarget === 'all' || row.type === levelTarget;
                return matchSearch && matchLevel;
            });
            
            // Sort
            filtered.sort((a, b) => {
                let valA, valB;
                switch (currentSort.column) {
                    case 'rank': valA = a.rankNum; valB = b.rankNum; break;
                    case 'type': valA = a.type; valB = b.type; break;
                    case 'name': valA = a.name; valB = b.name; break;
                    case 'winrate': valA = a.winrate; valB = b.winrate; break;
                    case 'cost': valA = a.cost; valB = b.cost; break;
                    default: return 0;
                }
                
                if (valA < valB) return currentSort.asc ? -1 : 1;
                if (valA > valB) return currentSort.asc ? 1 : -1;
                return 0;
            });
            
            // Render
            tableBody.innerHTML = '';
            filtered.forEach(row => {
                const tr = document.createElement('tr');
                
                let winClass = 'winrate-med';
                if (row.winrate >= 70) winClass = 'winrate-high';
                else if (row.winrate < 40) winClass = 'winrate-low';
                
                // Format details to highlight 3-stars if needed
                let formattedDetail = row.detail.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                tr.innerHTML = `
                    <td>${row.rankBadge}</td>
                    <td><span class="type-badge">${row.type}</span></td>
                    <td><strong>${row.name}</strong></td>
                    <td class="${winClass}">${row.winrateStr}</td>
                    <td>${row.tank}</td>
                    <td>${row.dealer}</td>
                    <td>${row.sub}</td>
                    <td>${row.costStr}</td>
                    <td class="unit-detail">${formattedDetail}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Init
        loadDefaultReport();
    </script>
</body>
</html>
