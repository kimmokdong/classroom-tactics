<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Tactics - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --primary-color: #8b5cf6;
            --secondary-color: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 16px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .content {
            padding: 40px;
            flex: 1;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .content.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Deck Editor */
        textarea {
            width: 100%;
            height: 400px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .action-btn {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Simulator Console */
        .console {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
            padding: 20px;
            border-radius: 12px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Compare */
        .compare-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        select {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.7);
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        th {
            background: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }
        
        .up { color: #10b981; font-weight: 600; }
        .down { color: #ef4444; font-weight: 600; }
        .neutral { color: var(--text-muted); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 Classroom Tactics Admin</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('editor')">📝 Deck Editor</button>
            <button class="tab-btn" onclick="switchTab('simulator')">⚙️ Simulator</button>
            <button class="tab-btn" onclick="switchTab('compare')">📈 Compare</button>
        </div>
    </header>

    <div id="editor" class="content active">
        <h2 style="margin-top:0;">Edit standard_decks.md</h2>
        <textarea id="deckContent" spellcheck="false"></textarea>
        <button class="action-btn" onclick="saveDecks()">💾 Save Decks</button>
    </div>

    <div id="simulator" class="content">
        <h2 style="margin-top:0;">Run PVE Simulation</h2>
        <p>This will run the simulation across all decks and update the latest report.</p>
        <button class="action-btn" id="simBtn" onclick="runSimulation()">🚀 Start Simulation</button>
        <div class="console" id="consoleOutput">Waiting for command...</div>
    </div>

    <div id="compare" class="content">
        <h2 style="margin-top:0;">Compare Simulation Reports</h2>
        <div class="compare-controls">
            <select id="reportA"><option>Loading...</option></select>
            <span>vs</span>
            <select id="reportB"><option>Loading...</option></select>
            <button class="action-btn" onclick="compareReports()">⚖️ Compare</button>
        </div>
        <div style="overflow-y:auto; max-height: 400px; border-radius: 12px;">
            <table id="compareTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Deck Name</th>
                        <th>Report A (Old)</th>
                        <th>Report B (New)</th>
                        <th>Difference</th>
                    </tr>
                </thead>
                <tbody id="compareBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:3000/api';

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if (tabId === 'compare') {
            loadReports();
        }
    }

    // Tab 1: Editor
    async function loadDecks() {
        try {
            const res = await fetch(`${API_BASE}/decks`);
            const data = await res.json();
            document.getElementById('deckContent').value = data.content;
        } catch (e) {
            console.error(e);
        }
    }

    async function saveDecks() {
        const content = document.getElementById('deckContent').value;
        const btn = event.target;
        btn.innerText = 'Saving...';
        try {
            await fetch(`${API_BASE}/decks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            setTimeout(() => btn.innerText = '✅ Saved!', 500);
            setTimeout(() => btn.innerText = '💾 Save Decks', 2000);
        } catch (e) {
            alert('Failed to save!');
            btn.innerText = '💾 Save Decks';
        }
    }

    // Tab 2: Simulator
    async function runSimulation() {
        const btn = document.getElementById('simBtn');
        const out = document.getElementById('consoleOutput');
        btn.innerText = 'Running...';
        btn.disabled = true;
        out.innerText = 'Simulation started. Please wait (this might take a few seconds)...\n';
        
        try {
            const res = await fetch(`${API_BASE}/simulate`, { method: 'POST' });
            const data = await res.json();
            if (data.error) {
                out.innerText += `\nError: ${data.error}\n${data.stderr}`;
            } else {
                out.innerText += `\n${data.output}`;
            }
        } catch (e) {
            out.innerText += `\nRequest failed: ${e.message}`;
        }
        btn.innerText = '🚀 Start Simulation';
        btn.disabled = false;
    }

    // Tab 3: Compare
    async function loadReports() {
        try {
            const res = await fetch(`${API_BASE}/reports`);
            const data = await res.json();
            const selectA = document.getElementById('reportA');
            const selectB = document.getElementById('reportB');
            
            selectA.innerHTML = '';
            selectB.innerHTML = '';
            
            data.reports.forEach(r => {
                selectA.innerHTML += `<option value="${r}">${r}</option>`;
                selectB.innerHTML += `<option value="${r}">${r}</option>`;
            });
            
            if(data.reports.length >= 2) {
                selectB.selectedIndex = 1; // Select different defaults
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function compareReports() {
        const reportA = document.getElementById('reportA').value;
        const reportB = document.getElementById('reportB').value;
        
        if (!reportA || !reportB) return alert('Select both reports');
        
        try {
            const res = await fetch(`${API_BASE}/compare`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reportA, reportB })
            });
            const data = await res.json();
            
            if (data.error) return alert(data.error);
            
            const tbody = document.getElementById('compareBody');
            tbody.innerHTML = '';
            
            data.diffs.forEach(item => {
                const tr = document.createElement('tr');
                const diffCls = item.diff > 0 ? 'up' : item.diff < 0 ? 'down' : 'neutral';
                const sign = item.diff > 0 ? '+' : '';
                const emoji = item.diff > 2 ? '🚀' : item.diff < -2 ? '📉' : '➖';
                
                tr.innerHTML = `
                    <td>${item.deckName}</td>
                    <td>${item.oldVal.toFixed(1)}%</td>
                    <td>${item.newVal.toFixed(1)}%</td>
                    <td class="${diffCls}">${emoji} ${sign}${item.diff.toFixed(1)}%</td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('compareTable').style.display = 'table';
            
        } catch (e) {
            console.error(e);
        }
    }

    // Init
    loadDecks();

</script>
</body>
</html>
